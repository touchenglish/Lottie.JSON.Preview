<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Growing Tree Lottie Preview</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f9fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: 320px;
      height: 320px;
      border-radius: 28px;
      background: rgba(255,255,255,.78);
      box-shadow: 0 18px 50px rgba(20,40,70,.10);
      display: grid;
      place-items: center;
    }
    #growthTree {
      width: 240px;
      height: 240px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="growthTree"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <script>
    lottie.loadAnimation({
      container: document.getElementById('growthTree'),
      renderer: 'svg',
      loop: false,
      autoplay: true,
      path: './growing-tree-lottie.json'
    });
  </script>
</body>
</html>
